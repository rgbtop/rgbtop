<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Protocol Registries</title>
    <script type="module" src="https://unpkg.com/preact@10/dist/preact.module.js"></script>
    <script type="module" src="https://unpkg.com/htm@3/dist/htm.module.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .registries {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .registry-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 3px solid transparent;
        }
        
        .registry-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            border-color: #667eea;
        }
        
        .registry-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .registry-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .registry-description {
            color: #4a5568;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }
        
        .registry-url {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            color: #667eea;
            background: #f7fafc;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            word-break: break-all;
            border-left: 4px solid #667eea;
        }
        
        .visit-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            width: 100%;
        }
        
        .visit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 2rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .registry-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script type="module">
        import { render, h } from 'https://unpkg.com/preact@10/dist/preact.module.js';
        import htm from 'https://unpkg.com/htm@3/dist/htm.module.js';
        
        const html = htm.bind(h);
        
        const registries = [
            {
                id: 1,
                name: 'RGB Exchange',
                description: 'Test registry for RGB assets and contracts. Explore the RGB ecosystem with this comprehensive testing platform.',
                url: 'https://test.rgbex.io/',
                icon: 'R'
            },
            {
                id: 2,
                name: 'Bitmask Registry',
                description: 'Beta registry interface for RGB protocol assets. Advanced tooling for RGB asset management and exploration.',
                url: 'https://beta.bitmask.app/#/registry',
                icon: 'B'
            },
            {
                id: 3,
                name: 'Bitlight Labs',
                description: 'Asset registry on testnet for RGB protocol development. Professional-grade RGB asset testing environment.',
                url: 'https://bitlightlabs.com/asset/testnet',
                icon: 'L'
            }
        ];
        
        function RegistryCard({ registry }) {
            return html`
                <div class="registry-card">
                    <div class="registry-title">
                        <div class="registry-icon">${registry.icon}</div>
                        ${registry.name}
                    </div>
                    <div class="registry-description">
                        ${registry.description}
                    </div>
                    <div class="registry-url">
                        ${registry.url}
                    </div>
                    <a href="${registry.url}" target="_blank" rel="noopener noreferrer" class="visit-button">
                        Visit Registry →
                    </a>
                </div>
            `;
        }
        
        function App() {
            return html`
                <div class="container">
                    <div class="header">
                        <h1>RGB Protocol Registries</h1>
                        <p>Explore RGB assets and contracts across different registry platforms</p>
                    </div>
                    
                    <div class="registries">
                        ${registries.map(registry => html`<${RegistryCard} key=${registry.id} registry=${registry} />`)}
                    </div>
                    
                    <div class="footer">
                        <p>RGB Protocol - Next generation smart contracts for Bitcoin</p>
                    </div>
                </div>
            `;
        }
        
        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
